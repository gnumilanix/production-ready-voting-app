on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    bootstrap-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform -chdir=terraform/bootstrap init -backend=false

            - name: Terraform Validate
              run: terraform -chdir=terraform/bootstrap validate
    bootstrap-plan:
        runs-on: ubuntu-latest
        needs: [bootstrap-validate]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: us-east-1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform -chdir=terraform/bootstrap init

            - name: Terraform Plan
              run: terraform -chdir=terraform/bootstrap plan -out=tfplan

            - name: Upload Plan Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tfplan-bootstrap
                  path: terraform/bootstrap/tfplan
                  retention-days: 1
    bootstrap-deploy:
        runs-on: ubuntu-latest
        needs: [bootstrap-plan]
        environment: production
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: us-east-1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform -chdir=terraform/bootstrap init

            - name: Download Plan Artifact
              uses: actions/download-artifact@v7
              with:
                  name: tfplan-bootstrap
                  path: terraform/bootstrap/

            - name: Terraform Apply
              run: terraform -chdir=terraform/bootstrap apply -auto-approve tfplan
