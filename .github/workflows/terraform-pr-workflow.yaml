name: terraform-pr
on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-pr-workflow.yaml'
      - '.github/actions/terraform-init/**'
      - '.github/scripts/**'

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
  SENTINEL_VERSION: 0.41.0

concurrency:
  group: voting-app-terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, deploy]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  policy-quality:
    name: Sentinel policy checks (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Sentinel Format Check
        uses: hashicorp/sentinel-github-actions@ad081c1fa7a6d8a53f9afd0996182b163e4a76a8
        with:
          stl_actions_version: ${{ env.SENTINEL_VERSION }}
          stl_actions_subcommand: fmt
          stl_actions_working_dir: terraform/sentinel
          stl_actions_comment: false

      - name: Sentinel Test
        uses: hashicorp/sentinel-github-actions@ad081c1fa7a6d8a53f9afd0996182b163e4a76a8
        with:
          stl_actions_version: ${{ env.SENTINEL_VERSION }}
          stl_actions_subcommand: test
          stl_actions_working_dir: terraform/sentinel
          stl_actions_comment: false

  plan:
    runs-on: ubuntu-latest
    needs: [validate, policy-quality]
    strategy:
      matrix:
        include:
          - stack: bootstrap
            state-key: bootstrap/terraform.tfstate
          - stack: deploy
            state-key: deploy/terraform.tfstate
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    env:
      TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
      TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/${{ matrix.stack }}
          bucket: ${{ vars.STATE_BUCKET_NAME }}
          key: ${{ matrix.state-key }}
          region: ${{ vars.AWS_REGION }}

      - name: Generate plan-only SSH key for Dependabot
        if: matrix.stack == 'deploy' && github.actor == 'dependabot[bot]'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/generate-plan-ssh-key.sh"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Setup Sentinel
        uses: hashicorp/setup-sentinel@79f4f0c293a3f625c0cb2edc3d6c759a42670463
        with:
          version: ${{ env.SENTINEL_VERSION }}

      - name: Evaluate Sentinel policies against the plan
        working-directory: terraform/sentinel
        run: |
          terraform -chdir="../${{ matrix.stack }}" show -json tfplan > /tmp/tfplan.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/generate-sentinel-mock.py" /tmp/tfplan.json mock-tfplan.sentinel
          sentinel apply -config=sentinel.hcl
          rm mock-tfplan.sentinel
