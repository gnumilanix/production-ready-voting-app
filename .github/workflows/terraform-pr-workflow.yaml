name: terraform-pr
on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-pr-workflow.yaml'
      - '.github/actions/terraform-init/**'

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}

concurrency:
  group: voting-app-terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, deploy]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - stack: bootstrap
            state-key: bootstrap/terraform.tfstate
          - stack: deploy
            state-key: deploy/terraform.tfstate
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    env:
      TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
      TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/${{ matrix.stack }}
          bucket: ${{ vars.STATE_BUCKET_NAME }}
          key: ${{ matrix.state-key }}
          region: ${{ vars.AWS_REGION }}

      - name: Terraform Plan
        run: terraform plan -input=false
