name: deploy-terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_run:
      workflows: ["bootstrap-terraform"]
      types:
          - completed
  workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
defaults:
  run:
    working-directory: terraform/deploy

jobs:
    validate:
        # if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform init -backend=false

            - name: Terraform Validate
              run: terraform validate
    plan:
        runs-on: ubuntu-latest
        needs: [validate]
        env:
            TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
            TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: |
                terraform init \
                    -backend-config="bucket=${{ vars.STATE_BUCKET_NAME }}" \
                    -backend-config="key=deploy/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="use_lockfile=true"

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Upload Plan Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tfplan-deploy
                  path: terraform/deploy/tfplan
                  retention-days: 1
    deploy:
        runs-on: ubuntu-latest
        needs: [plan]
        environment: production
        env:
            TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
            TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
        outputs:
            jump_server_ip: ${{ steps.export-tf-outputs.outputs.JUMP_SERVER_IP }}
            eks_cluster_name: ${{ steps.export-tf-outputs.outputs.EKS_CLUSTER_NAME }}
            eks_cluster_region: ${{ steps.export-tf-outputs.outputs.EKS_CLUSTER_REGION }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: |
                terraform init \
                    -backend-config="bucket=${{ vars.STATE_BUCKET_NAME }}" \
                    -backend-config="key=deploy/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="use_lockfile=true"

            - name: Download Plan Artifact
              uses: actions/download-artifact@v7
              with:
                  name: tfplan-deploy
                  path: terraform/deploy/

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan

            - name: Capture Terraform Outputs
              id: export-tf-outputs
              run: |
                echo "JUMP_SERVER_IP=$(terraform output -raw jump_server_public_ip)" >> "$GITHUB_OUTPUT"
                echo "EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
                echo "EKS_CLUSTER_REGION=$(terraform output -raw eks_cluster_region)" >> "$GITHUB_OUTPUT"

    configure:
        runs-on: ubuntu-latest
        needs: [deploy]
        environment: production
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Install kubectl on jump server
              uses: dawidd6/action-ansible-playbook@v9
              with:
                  playbook: install-kubectl.yml
                  directory: ansible
                  key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
                  inventory: |
                      [jump_server]
                      ${{ needs.deploy.outputs.jump_server_ip }} ansible_user=ec2-user eks_cluster_name=${{ needs.deploy.outputs.eks_cluster_name }} eks_cluster_region=${{ needs.deploy.outputs.eks_cluster_region }}

