name: deploy-terraform
on:
  workflow_run:
      workflows: ["bootstrap-terraform"]
      types:
          - completed
  workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
    TF_VAR_eks_console_principal_arn: ${{ vars.EKS_CONSOLE_PRINCIPAL_ARN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
defaults:
  run:
    working-directory: terraform/deploy

jobs:
    validate:
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform init -backend=false

            - name: Terraform Validate
              run: terraform validate
    plan:
        runs-on: ubuntu-latest
        needs: [validate]
        env:
            TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
            TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              uses: ./.github/actions/terraform-init
              with:
                  working-directory: terraform/deploy
                  bucket: ${{ vars.STATE_BUCKET_NAME }}
                  key: deploy/terraform.tfstate
                  region: ${{ vars.AWS_REGION }}

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Upload Plan Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tfplan-deploy
                  path: terraform/deploy/tfplan
                  retention-days: 1
    deploy:
        runs-on: ubuntu-latest
        needs: [plan]
        environment: production
        env:
            TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
            TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}
        outputs:
            jump_server_ip: ${{ steps.export-tf-outputs.outputs.JUMP_SERVER_IP }}
            eks_cluster_name: ${{ steps.export-tf-outputs.outputs.EKS_CLUSTER_NAME }}
            eks_cluster_region: ${{ steps.export-tf-outputs.outputs.EKS_CLUSTER_REGION }}
            aws_load_balancer_controller_role_arn: ${{ steps.export-tf-outputs.outputs.AWS_LOAD_BALANCER_CONTROLLER_ROLE_ARN }}
            controller_installer_role_arn: ${{ steps.export-tf-outputs.outputs.CONTROLLER_INSTALLER_ROLE_ARN }}
            vpc_id: ${{ steps.export-tf-outputs.outputs.VPC_ID }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              uses: ./.github/actions/terraform-init
              with:
                  working-directory: terraform/deploy
                  bucket: ${{ vars.STATE_BUCKET_NAME }}
                  key: deploy/terraform.tfstate
                  region: ${{ vars.AWS_REGION }}

            - name: Download Plan Artifact
              uses: actions/download-artifact@v7
              with:
                  name: tfplan-deploy
                  path: terraform/deploy/

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan

            - name: Capture Terraform Outputs
              id: export-tf-outputs
              run: |
                echo "JUMP_SERVER_IP=$(terraform output -raw jump_server_public_ip)" >> "$GITHUB_OUTPUT"
                echo "EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
                echo "EKS_CLUSTER_REGION=$(terraform output -raw eks_cluster_region)" >> "$GITHUB_OUTPUT"
                echo "AWS_LOAD_BALANCER_CONTROLLER_ROLE_ARN=$(terraform output -raw aws_load_balancer_controller_role_arn)" >> "$GITHUB_OUTPUT"
                echo "CONTROLLER_INSTALLER_ROLE_ARN=$(terraform output -raw controller_installer_role_arn)" >> "$GITHUB_OUTPUT"
                echo "VPC_ID=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"

    configure:
        runs-on: ubuntu-latest
        needs: [deploy]
        environment: production
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Configure cluster with Ansible
              uses: dawidd6/action-ansible-playbook@v9
              env:
                  ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
              with:
                  playbook: configure-cluster.yml
                  directory: ansible
                  key: ${{ secrets.JUMP_SERVER_PRIVATE_KEY }}
                  inventory: |
                      [jump_server]
                      ${{ needs.deploy.outputs.jump_server_ip }} ansible_user=ec2-user

                      [jump_server:vars]
                      eks_cluster_name=${{ needs.deploy.outputs.eks_cluster_name }}
                      eks_cluster_region=${{ needs.deploy.outputs.eks_cluster_region }}
                      vpc_id=${{ needs.deploy.outputs.vpc_id }}
                      controller_role_arn=${{ needs.deploy.outputs.aws_load_balancer_controller_role_arn }}
                      installer_role_arn=${{ needs.deploy.outputs.controller_installer_role_arn }}
