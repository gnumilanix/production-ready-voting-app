name: build-app-images

on:
  push:
    branches:
      - main
    paths:
      - app/result/**
      - app/seed-data/**
      - app/vote/**
      - app/worker/**

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            result:
              - 'app/result/**'
            seed-data:
              - 'app/seed-data/**'
            vote:
              - 'app/vote/**'
            worker:
              - 'app/worker/**'

  build:
    needs: filter
    if: needs.filter.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.filter.outputs.components) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=main-latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}