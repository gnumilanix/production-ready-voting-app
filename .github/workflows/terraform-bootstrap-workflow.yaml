name: bootstrap-terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform -chdir=terraform/bootstrap init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/bootstrap validate
  plan:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: >-
          terraform -chdir=terraform/bootstrap init
          -backend-config="bucket=${{ vars.STATE_BUCKET_NAME }}"
          -backend-config="key=bootstrap/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=arn:aws:kms:${{ vars.AWS_REGION }}:365020425296:alias/prod-voting-app-terraform-state"

      - name: Terraform Plan
        run: terraform -chdir=terraform/bootstrap plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-bootstrap
          path: terraform/bootstrap/tfplan
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [plan]
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: >-
          terraform -chdir=terraform/bootstrap init
          -backend-config="bucket=${{ vars.STATE_BUCKET_NAME }}"
          -backend-config="key=bootstrap/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=arn:aws:kms:${{ vars.AWS_REGION }}:365020425296:alias/prod-voting-app-terraform-state"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v7
        with:
          name: tfplan-bootstrap
          path: terraform/bootstrap/

      - name: Terraform Apply
        run: terraform -chdir=terraform/bootstrap apply -auto-approve tfplan
