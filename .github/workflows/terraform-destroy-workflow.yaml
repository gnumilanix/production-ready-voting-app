name: destroy-terraform-deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY voting-app infrastructure to continue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_jump_server_ssh_cidr: ${{ vars.JUMP_SERVER_SSH_CIDR }}
  TF_VAR_jump_server_public_key: ${{ secrets.JUMP_SERVER_PUBLIC_KEY }}

concurrency:
  group: deploy-terraform-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform/deploy

jobs:
  plan-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DESTROY voting-app infrastructure" ]]; then
            echo "Confirmation did not match; refusing to destroy infrastructure."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize deploy state
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/deploy
          bucket: ${{ vars.STATE_BUCKET_NAME }}
          key: deploy/terraform.tfstate
          region: ${{ vars.AWS_REGION }}

      - name: Create destroy plan
        run: terraform plan -destroy -out=tfplan

      - name: Upload destroy plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-destroy-deploy
          path: terraform/deploy/tfplan
          retention-days: 1

  destroy:
    runs-on: ubuntu-latest
    needs: [plan-destroy]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::365020425296:role/GitHubActionsTerraformRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize deploy state
        uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/deploy
          bucket: ${{ vars.STATE_BUCKET_NAME }}
          key: deploy/terraform.tfstate
          region: ${{ vars.AWS_REGION }}

      - name: Download destroy plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-destroy-deploy
          path: terraform/deploy/

      - name: Apply destroy plan
        run: terraform apply -auto-approve tfplan