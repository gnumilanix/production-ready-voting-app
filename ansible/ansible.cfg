[ssh_connection]
# Keep SSH control connections alive during long-running tasks that produce
# no output (e.g. helm upgrade --wait), so NAT/relay idle timeouts don't
# drop the session mid-playbook.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes
pipelining = true
