---
- name: Configure AWS Load Balancer Controller
  hosts: all
  gather_facts: false
  vars:
    controller_namespace: kube-system
    controller_service_account: aws-load-balancer-controller
    controller_chart_version: 3.5.0
    controller_webhook_cert_secret: aws-load-balancer-tls
  tasks:
    - name: Assume the Terraform-managed controller installer role
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - assume-role
          - --role-arn
          - "{{ installer_role_arn }}"
          - --role-session-name
          - ansible-controller-installer
          - --region
          - "{{ eks_cluster_region }}"
          - --query
          - Credentials
          - --output
          - json
      register: controller_installer_credentials
      changed_when: false
      no_log: true

    - name: Set temporary AWS credentials for controller installation
      ansible.builtin.set_fact:
        controller_installer_environment:
          AWS_ACCESS_KEY_ID: "{{ (controller_installer_credentials.stdout | from_json).AccessKeyId }}"
          AWS_SECRET_ACCESS_KEY: "{{ (controller_installer_credentials.stdout | from_json).SecretAccessKey }}"
          AWS_SESSION_TOKEN: "{{ (controller_installer_credentials.stdout | from_json).SessionToken }}"
          AWS_DEFAULT_REGION: "{{ eks_cluster_region }}"
          AWS_REGION: "{{ eks_cluster_region }}"
          KUBECONFIG: /tmp/voting-app-controller-installer-kubeconfig
          no_log: true

    - name: Configure kubeconfig using the installer role
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-kubeconfig
          - --name
          - "{{ eks_cluster_name }}"
          - --region
          - "{{ eks_cluster_region }}"
      environment: "{{ controller_installer_environment }}"
      changed_when: true

    - name: Read current service account IAM role annotation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - serviceaccount
          - "{{ controller_service_account }}"
          - --namespace
          - "{{ controller_namespace }}"
          - -o
          - jsonpath={.metadata.annotations.eks\.amazonaws\.com/role-arn}
      register: current_service_account_role
      changed_when: false
      failed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Ensure the controller service account exists
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl create serviceaccount {{ controller_service_account }} \
            --namespace {{ controller_namespace }} \
          --dry-run=client -o yaml | kubectl apply -f -
        executable: /bin/bash
      register: controller_service_account_apply
      changed_when: "' created' in controller_service_account_apply.stdout or ' configured' in controller_service_account_apply.stdout"
      become: false
      environment: "{{ controller_installer_environment }}"

    - name: Annotate the service account with the Terraform-managed role
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - serviceaccount
          - "{{ controller_service_account }}"
          - --namespace
          - "{{ controller_namespace }}"
          - "eks.amazonaws.com/role-arn={{ controller_role_arn }}"
          - --overwrite
      when: current_service_account_role.stdout | trim != controller_role_arn
      changed_when: true
      environment: "{{ controller_installer_environment }}"

    - name: Verify the controller service account role annotation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - serviceaccount
          - "{{ controller_service_account }}"
          - --namespace
          - "{{ controller_namespace }}"
          - -o
          - jsonpath={.metadata.annotations.eks\.amazonaws\.com/role-arn}
      register: verified_service_account_role
      changed_when: false
      failed_when: verified_service_account_role.stdout | trim != controller_role_arn
      environment: "{{ controller_installer_environment }}"

    - name: Add the AWS EKS Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - eks
          - https://aws.github.io/eks-charts
          - --force-update
      changed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Update Helm chart repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - eks
      changed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Install or upgrade AWS Load Balancer Controller
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - aws-load-balancer-controller
          - eks/aws-load-balancer-controller
          - --version
          - "{{ controller_chart_version }}"
          - --namespace
          - "{{ controller_namespace }}"
          - --wait
          - --timeout
          - 5m
          - --set
          - "clusterName={{ eks_cluster_name }}"
          - --set
          - serviceAccount.create=false
          - --set
          - serviceAccount.name=aws-load-balancer-controller
          - --set-string
          - 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ controller_role_arn }}'
          - --set
          - enableGatewayAPI=true
          - --set
          - "region={{ eks_cluster_region }}"
          - --set
          - "vpcId={{ vpc_id }}"
          - --set
          - keepTLSSecret=true
      register: helm_install
      changed_when: "'has been installed' in helm_install.stdout or 'has been upgraded' in helm_install.stdout"
      environment: "{{ controller_installer_environment }}"

    - name: Check AWS Load Balancer Controller webhook certificate trust
      ansible.builtin.command:
        argv:
          - kubectl
          - create
          - service
          - clusterip
          - lbc-webhook-cert-check
          - --tcp=80:80
          - --namespace
          - "{{ controller_namespace }}"
          - --dry-run=server
          - -o
          - yaml
      register: controller_webhook_tls_check
      changed_when: false
      failed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Remove the stale AWS Load Balancer Controller webhook certificate
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - secret
          - "{{ controller_webhook_cert_secret }}"
          - --namespace
          - "{{ controller_namespace }}"
          - --ignore-not-found=true
      register: controller_webhook_tls_secret
      changed_when: true
      when: "'certificate signed by unknown authority' in controller_webhook_tls_check.stderr"
      environment: "{{ controller_installer_environment }}"

    - name: Regenerate the AWS Load Balancer Controller webhook certificate
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - aws-load-balancer-controller
          - eks/aws-load-balancer-controller
          - --version
          - "{{ controller_chart_version }}"
          - --namespace
          - "{{ controller_namespace }}"
          - --wait
          - --timeout
          - 5m
          - --set
          - "clusterName={{ eks_cluster_name }}"
          - --set
          - serviceAccount.create=false
          - --set
          - serviceAccount.name=aws-load-balancer-controller
          - --set-string
          - 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ controller_role_arn }}'
          - --set
          - enableGatewayAPI=true
          - --set
          - "region={{ eks_cluster_region }}"
          - --set
          - "vpcId={{ vpc_id }}"
          - --set
          - keepTLSSecret=true
      when: controller_webhook_tls_secret is changed
      changed_when: true
      environment: "{{ controller_installer_environment }}"

    - name: Restart AWS Load Balancer Controller after certificate rotation
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - restart
          - deployment/aws-load-balancer-controller
          - --namespace
          - "{{ controller_namespace }}"
      when: controller_webhook_tls_secret is changed
      changed_when: true
      environment: "{{ controller_installer_environment }}"

    - name: Wait for AWS Load Balancer Controller rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/aws-load-balancer-controller
          - --namespace
          - "{{ controller_namespace }}"
          - --timeout=180s
      when: controller_webhook_tls_secret is changed
      changed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Verify AWS Load Balancer Controller webhook certificate trust
      ansible.builtin.command:
        argv:
          - kubectl
          - create
          - service
          - clusterip
          - lbc-webhook-cert-check
          - --tcp=80:80
          - --namespace
          - "{{ controller_namespace }}"
          - --dry-run=server
          - -o
          - yaml
      changed_when: false
      environment: "{{ controller_installer_environment }}"
