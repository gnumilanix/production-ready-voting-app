---
- name: Configure AWS Load Balancer Controller
  hosts: all
  gather_facts: false
  vars:
    controller_namespace: kube-system
    controller_service_account: aws-load-balancer-controller
  tasks:
    - name: Assume the Terraform-managed controller installer role
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - assume-role
          - --role-arn
          - "{{ installer_role_arn }}"
          - --role-session-name
          - ansible-controller-installer
          - --region
          - "{{ eks_cluster_region }}"
          - --query
          - Credentials
          - --output
          - json
      register: controller_installer_credentials
      changed_when: false
      no_log: true

    - name: Set temporary AWS credentials for controller installation
      ansible.builtin.set_fact:
        controller_installer_environment:
          AWS_ACCESS_KEY_ID: "{{ (controller_installer_credentials.stdout | from_json).AccessKeyId }}"
          AWS_SECRET_ACCESS_KEY: "{{ (controller_installer_credentials.stdout | from_json).SecretAccessKey }}"
          AWS_SESSION_TOKEN: "{{ (controller_installer_credentials.stdout | from_json).SessionToken }}"
          AWS_DEFAULT_REGION: "{{ eks_cluster_region }}"
          AWS_REGION: "{{ eks_cluster_region }}"
          KUBECONFIG: /tmp/voting-app-controller-installer-kubeconfig
          no_log: true

    - name: Configure kubeconfig using the installer role
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-kubeconfig
          - --name
          - "{{ eks_cluster_name }}"
          - --region
          - "{{ eks_cluster_region }}"
      environment: "{{ controller_installer_environment }}"
      changed_when: true

    - name: Read current service account IAM role annotation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - serviceaccount
          - "{{ controller_service_account }}"
          - --namespace
          - "{{ controller_namespace }}"
          - -o
          - jsonpath={.metadata.annotations.eks\.amazonaws\.com/role-arn}
      register: current_service_account_role
      changed_when: false
      failed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Ensure the controller service account exists
      ansible.builtin.shell:
        cmd: >-
          kubectl create serviceaccount {{ controller_service_account }}
          --namespace {{ controller_namespace }}
          --dry-run=client -o yaml | kubectl apply -f -
      when: current_service_account_role.rc != 0
      changed_when: true
      become: false
      environment: "{{ controller_installer_environment }}"

    - name: Annotate the service account with the Terraform-managed role
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - serviceaccount
          - "{{ controller_service_account }}"
          - --namespace
          - "{{ controller_namespace }}"
          - "eks.amazonaws.com/role-arn={{ controller_role_arn }}"
          - --overwrite
      when: current_service_account_role.stdout | trim != controller_role_arn
      changed_when: true
      environment: "{{ controller_installer_environment }}"

    - name: Add the AWS EKS Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - eks
          - https://aws.github.io/eks-charts
          - --force-update
      changed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Update Helm chart repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - eks
      changed_when: false
      environment: "{{ controller_installer_environment }}"

    - name: Install or upgrade AWS Load Balancer Controller
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - aws-load-balancer-controller
          - eks/aws-load-balancer-controller
          - --namespace
          - "{{ controller_namespace }}"
          - --set
          - "clusterName={{ eks_cluster_name }}"
          - --set
          - serviceAccount.create=false
          - --set
          - serviceAccount.name=aws-load-balancer-controller
          - --set-string
          - 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ controller_role_arn }}'
          - --set
          - enableGatewayAPI=true
          - --set
          - "region={{ eks_cluster_region }}"
          - --set
          - "vpcId={{ vpc_id }}"
      register: helm_install
      changed_when: "'has been installed' in helm_install.stdout or 'has been upgraded' in helm_install.stdout"
      environment: "{{ controller_installer_environment }}"
