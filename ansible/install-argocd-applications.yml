---
- name: Install Argo CD applications
  hosts: all
  gather_facts: false
  vars:
    installer_kubeconfig: /tmp/voting-app-argocd-applications-kubeconfig
  environment:
    AWS_DEFAULT_REGION: "{{ eks_cluster_region }}"
    AWS_REGION: "{{ eks_cluster_region }}"
    KUBECONFIG: "{{ installer_kubeconfig }}"
  tasks:
    - name: Configure installer kubeconfig
      ansible.builtin.import_tasks: tasks/configure-installer-kubeconfig.yml

    - name: Apply shared Gateway prerequisites
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "-"]
        stdin: "{{ lookup('file', playbook_dir ~ '/../' ~ item) }}"
      loop:
        - argo/prerequisites/namespace.yaml
        - argo/prerequisites/serviceaccount.yaml
        - argo/prerequisites/gatewayclass.yaml
        - argo/prerequisites/gateway.yaml
      loop_control:
        label: "{{ item }}"
      register: gateway_prerequisite_apply
      changed_when: "' created' in gateway_prerequisite_apply.stdout or ' configured' in gateway_prerequisite_apply.stdout"

    - name: Apply the Argo CD Image Updater Application
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ lookup('file', playbook_dir ~ '/../argo/image-updater-application.yaml') }}"
      register: image_updater_application
      changed_when: "' created' in image_updater_application.stdout or ' configured' in image_updater_application.stdout"

    - name: Wait for the Argo CD Image Updater Application to become healthy
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/argocd-image-updater
          - --namespace
          - argocd
          - --for=jsonpath={.status.health.status}=Healthy
          - --timeout=300s
      changed_when: false

    - name: Wait for the ImageUpdater custom resource definition
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Established
          - --timeout=120s
          - crd/imageupdaters.argocd-image-updater.argoproj.io
      changed_when: false

    - name: Apply the voting ImageUpdater configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ lookup('file', playbook_dir ~ '/../argo/image-updater.yaml') }}"
      register: image_updater_config
      changed_when: "' created' in image_updater_config.stdout or ' configured' in image_updater_config.stdout"

    - name: Create the EFS StorageClass for Vault
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', 'vault-storageclass.yaml.j2') }}"
      register: vault_storage_class
      changed_when: "' created' in vault_storage_class.stdout or ' configured' in vault_storage_class.stdout"

    - name: Apply remaining Argo CD bootstrap applications
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "-"]
        stdin: "{{ lookup('file', playbook_dir ~ '/../' ~ item) }}"
      loop:
        - argo/karpenter-application.yaml
        - argo/rollout-application.yaml
        - argo/vault-application.yaml
        - argo/voting-application.yaml
      loop_control:
        label: "{{ item }}"
      register: bootstrap_application_apply
      changed_when: "' created' in bootstrap_application_apply.stdout or ' configured' in bootstrap_application_apply.stdout"
