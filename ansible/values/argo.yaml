global:
  domain: "" 

configs:
  cm:
    timeout.reconciliation: 600s
    timeout.reconciliation.jitter: 30s
    
controller:
  serviceAccount:
    create: true
    name: argocd-application-controller

server:
  extraArgs:
    - --insecure

  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: voting-gateway
        namespace: voting
        sectionName: argocd-ui
