---
- name: Install Argo CD
  hosts: all
  gather_facts: false
  vars:
    argocd_namespace: argocd
    argocd_values_file: /tmp/voting-app-argocd-values.yaml
    installer_kubeconfig: /tmp/voting-app-argocd-kubeconfig
  environment:
    AWS_DEFAULT_REGION: "{{ eks_cluster_region }}"
    AWS_REGION: "{{ eks_cluster_region }}"
    KUBECONFIG: "{{ installer_kubeconfig }}"
  tasks:
    - name: Install Argo CD CLI
      ansible.builtin.import_tasks: tasks/install-argocd-cli.yml

    - name: Configure installer kubeconfig
      ansible.builtin.import_tasks: tasks/configure-installer-kubeconfig.yml

    - name: Copy Argo CD Helm values to the jump server
      ansible.builtin.copy:
        src: values/argo.yaml
        dest: "{{ argocd_values_file }}"
        mode: "0644"

    - name: Add the Argo Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - argo
          - https://argoproj.github.io/argo-helm
          - --force-update
      changed_when: false

    - name: Update the Argo Helm chart repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - argo
      changed_when: false

    - name: Install or upgrade Argo CD
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argocd
          - argo/argo-cd
          - --namespace
          - "{{ argocd_namespace }}"
          - --create-namespace
          - --values
          - "{{ argocd_values_file }}"
          - --wait
          - --timeout
          - 10m
      register: argocd_helm_install
      changed_when: "'has been installed' in argocd_helm_install.stdout or 'has been upgraded' in argocd_helm_install.stdout"

    - name: Wait for the Argo CD configuration ConfigMap
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=create
          - --timeout=120s
          - configmap/argocd-cm
          - --namespace
          - "{{ argocd_namespace }}"
      changed_when: false

    - name: Apply the Argo CD TargetGroupConfiguration
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ lookup('file', playbook_dir ~ '/../argo/argocd/tg-config.yaml') }}"
      register: argocd_tg_config
      changed_when: "' created' in argocd_tg_config.stdout or ' configured' in argocd_tg_config.stdout"

    - name: Apply the Argo CD ReferenceGrant
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ lookup('file', playbook_dir ~ '/../argo/argocd/reference-grant.yaml') }}"
      register: argocd_reference_grant
      changed_when: "' created' in argocd_reference_grant.stdout or ' configured' in argocd_reference_grant.stdout"

    - name: Apply the voting AppProject
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ lookup('file', playbook_dir ~ '/../argo/project.yaml') }}"
      register: argocd_project
      changed_when: "' created' in argocd_project.stdout or ' configured' in argocd_project.stdout"
