---
- name: Install Gateway API CRDs
  hosts: all
  gather_facts: false
  vars:
    # Must match the Gateway API version the AWS Load Balancer Controller is
    # built against (v3.6.0 targets Gateway API CRDs v1.6.0). A mismatch leaves
    # the apiserver unable to serve/validate the controller's resources.
    gateway_api_version: v1.6.0
  environment: "{{ eks_cluster_environment }}"
  tasks:
    - name: Configure installer kubeconfig
      ansible.builtin.import_tasks: tasks/configure-installer-kubeconfig.yml

    - name: Apply the Gateway API standard CRDs
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --server-side
          - -f
          - "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"
      register: gateway_api_crds
      changed_when: "'unchanged' not in gateway_api_crds.stdout"

    - name: Wait for core Gateway API CRDs to become established
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Established
          - --timeout=120s
          - crd/gatewayclasses.gateway.networking.k8s.io
          - crd/gateways.gateway.networking.k8s.io
          - crd/httproutes.gateway.networking.k8s.io
          - crd/referencegrants.gateway.networking.k8s.io
      changed_when: false