---
- name: Remove Kubernetes-managed AWS resources before Terraform teardown
  hosts: jump_server
  gather_facts: false
  vars:
    installer_kubeconfig: /tmp/voting-app-destroy-kubeconfig
  environment:
    AWS_DEFAULT_REGION: "{{ eks_cluster_region }}"
    AWS_REGION: "{{ eks_cluster_region }}"
    KUBECONFIG: "{{ installer_kubeconfig }}"
  tasks:
    - name: Check whether the EKS cluster still exists
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-cluster
          - --name
          - "{{ eks_cluster_name }}"
          - --region
          - "{{ eks_cluster_region }}"
      register: eks_cluster_check
      changed_when: false
      failed_when: >-
        eks_cluster_check.rc != 0 and
        'ResourceNotFoundException' not in eks_cluster_check.stderr

    - name: Skip Kubernetes cleanup when EKS is already absent
      ansible.builtin.debug:
        msg: "EKS cluster {{ eks_cluster_name }} is already absent; continuing with Terraform cleanup."
      when: eks_cluster_check.rc != 0

    - name: Ensure Argo CD CLI is installed on the jump host
      ansible.builtin.import_tasks: tasks/install-argocd-cli.yml
      when: eks_cluster_check.rc == 0

    - name: Configure installer kubeconfig
      ansible.builtin.import_tasks: tasks/configure-installer-kubeconfig.yml
      when: eks_cluster_check.rc == 0

    - name: Run Argo CD cleanup and reset kube context
      when: eks_cluster_check.rc == 0
      block:
        - name: Point current kube context at the argocd namespace
          ansible.builtin.command:
            argv:
              - kubectl
              - config
              - set-context
              - --current
              - --namespace=argocd
          changed_when: true

        - name: Log in to Argo CD CLI in core mode
          ansible.builtin.command:
            argv: [argocd, login, --core]
          register: argocd_core_login
          changed_when: false

        - name: List Argo CD applications
          ansible.builtin.command:
            argv:
              - argocd
              - --core
              - app
              - list
              - --app-namespace
              - argocd
              - --output
              - name
          register: argocd_applications
          changed_when: false
          ignore_errors: true

        - name: Block all Argo CD syncs with a deny sync window on the project
          ansible.builtin.command:
            argv:
              - argocd
              - --core
              - proj
              - windows
              - add
              - playground
              - --kind
              - deny
              - --schedule
              - "* * * * *"
              - --duration
              - 24h
              - --applications
              - "*"
              - --namespaces
              - "*"
          register: argocd_sync_window
          changed_when: true
          ignore_errors: true

        - name: Cascade-delete the remaining Argo CD applications
          ansible.builtin.command:
            argv:
              - argocd
              - --core
              - app
              - delete
              - "{{ item | regex_replace('^argocd/', '') }}"
              - --app-namespace
              - argocd
              - --cascade
              - --yes
              - --wait
          loop: "{{ argocd_applications.stdout_lines | default([]) | map('regex_replace', '^argocd/', '') | reject('equalto', 'karpenter-controller') | list }}"
          register: argocd_applications_delete
          changed_when: true
          async: 120
          poll: 15
          ignore_errors: true
      always:
        - name: Reset kube context namespace to default
          ansible.builtin.command:
            argv:
              - kubectl
              - config
              - set-context
              - --current
              - --namespace=default
          changed_when: true
          ignore_errors: true

    - name: Uninstall Argo CD and wait for its Ingress ALB cleanup
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - argocd
          - --namespace
          - argocd
          - --ignore-not-found=true
          - --wait=true
          - --timeout=10m
      register: argocd_helm_uninstall
      changed_when: "'uninstalled' in argocd_helm_uninstall.stdout"
      when: eks_cluster_check.rc == 0

    - name: Delete the Karpenter NodePool to stop new Karpenter capacity
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - nodepool.karpenter.sh
          - voting-app-nodepool
          - --ignore-not-found=true
          - --wait=true
          - --timeout=5m
      register: karpenter_nodepool_delete
      changed_when: "' deleted' in karpenter_nodepool_delete.stdout"
      when: eks_cluster_check.rc == 0

    - name: Delete Karpenter NodeClaims and wait for instance termination
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - nodeclaims.karpenter.sh
          - --all
          - --wait=true
          - --timeout=30m
      register: karpenter_nodeclaims_delete
      changed_when: "' deleted' in karpenter_nodeclaims_delete.stdout"
      when: eks_cluster_check.rc == 0

    - name: Delete the Karpenter EC2NodeClass and generated instance profiles
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - ec2nodeclass.karpenter.k8s.aws
          - voting-app-nodeclass
          - --ignore-not-found=true
          - --wait=true
          - --timeout=5m
      register: karpenter_nodeclass_delete
      changed_when: "' deleted' in karpenter_nodeclass_delete.stdout"
      when: eks_cluster_check.rc == 0

    - name: Delete the shared Gateway and wait for its ALB cleanup
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - gateway
          - voting-gateway
          - --namespace
          - voting
          - --ignore-not-found=true
          - --wait=true
          - --timeout=20m
      register: voting_gateway_delete
      changed_when: "' deleted' in voting_gateway_delete.stdout"
      when: eks_cluster_check.rc == 0