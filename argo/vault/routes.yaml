apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: voting-gateway
      namespace: voting
      sectionName: vault-ui
  rules:
    - backendRefs:
        - name: vault
          port: 8200
