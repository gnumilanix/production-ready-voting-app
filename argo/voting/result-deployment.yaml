apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: voting
  labels:
    app: result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: voting-role
        vault.hashicorp.com/agent-inject-secret-config: secret/data/postgres-creds
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/postgres-creds" -}}
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          {{- end -}}
    spec:
      serviceAccountName: voting
      containers:
        - name: result
          image: ghcr.io/gnumilanix/production-ready-voting-app-result:main-latest
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && exec node server.js"]
          ports:
            - name: result
              containerPort: 80
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi