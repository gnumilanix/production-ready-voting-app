apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: voting
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          command: ["sh", "-c"]
          args: [". /vault/secrets/config && exec docker-entrypoint.sh postgres"]
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          emptyDir: {}