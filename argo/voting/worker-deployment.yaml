apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/gnumilanix/production-ready-voting-app-worker:main-latest
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && exec dotnet Worker.dll"]
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: worker