apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: voting-role
        vault.hashicorp.com/agent-inject-secret-config: secret/data/postgres-creds
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/postgres-creds" -}}
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          {{- end -}}
    spec:
      serviceAccountName: voting
      containers:
        - name: worker
          image: ghcr.io/gnumilanix/production-ready-voting-app-worker:main-latest
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && exec dotnet Worker.dll"]
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: worker
      tolerations:
        - key: workload-type
          operator: Equal
          value: karpenter-voting-app-spot
          effect: NoSchedule