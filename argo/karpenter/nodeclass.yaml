apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: voting-app-nodeclass
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  role: "voting-app-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "voting-app"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "voting-app"
  amiSelectorTerms:
    - alias: al2023@latest
  kubelet:
    maxPods: 110
