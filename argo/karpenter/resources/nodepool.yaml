apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: voting-app-nodepool
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: voting-app-nodeclass
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["t", "m", "c"]
        - key: "karpenter.k8s.aws/instance-size"
          operator: In
          values: ["small", "medium", "large"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      taints:
        - key: "workload-type"
          value: "karpenter-playground-spot"
          effect: NoSchedule
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "1"